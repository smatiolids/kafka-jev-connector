name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check tag matches project version
        run: |
          VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pom version ${VERSION}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build and test
        run: mvn -B verify

      - name: Checksum plugin ZIP
        run: |
          cd target
          sha256sum "kafka-jev-connector-${VERSION}-plugin.zip" > "kafka-jev-connector-${VERSION}-plugin.zip.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "target/kafka-jev-connector-${VERSION}-plugin.zip" \
            "target/kafka-jev-connector-${VERSION}-plugin.zip.sha256" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
